name: Android Tests
on:
  workflow_dispatch:
    inputs:
      run_instrumentation:
        description: 'Also run Android instrumentation tests on an emulator'
        required: true
        default: false
        type: boolean
jobs:
  unit-tests:
    name: JVM Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest --console=plain --no-daemon --stacktrace
  instrumentation-tests:
    name: Android Instrumentation Tests
    if: ${{ inputs.run_instrumentation }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --console=plain --no-daemon --stacktrace
