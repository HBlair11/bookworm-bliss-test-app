name: Release
# Production signing remains separate from the permanent debug key.
on:
  push:
    tags: ['v*']
jobs:
  release:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew
      - name: Build release
        env:
          KEYSTORE_BASE64: '${{ secrets.EPUB_APP_RELEASE_KEYSTORE_BASE64 }}'
          STORE_PASSWORD: '${{ secrets.EPUB_APP_RELEASE_KEYSTORE_PASSWORD }}'
          KEY_ALIAS: '${{ secrets.EPUB_APP_RELEASE_KEY_ALIAS }}'
          KEY_PASSWORD: '${{ secrets.EPUB_APP_RELEASE_KEY_PASSWORD }}'
        run: |
          set -e
          test -n "$KEYSTORE_BASE64"; test -n "$STORE_PASSWORD"; test -n "$KEY_ALIAS"; test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > app/the-bookworm-bliss-release.jks
          printf '%s\n' "storeFile=app/the-bookworm-bliss-release.jks" "storePassword=$STORE_PASSWORD" "keyAlias=$KEY_ALIAS" "keyPassword=$KEY_PASSWORD" > keystore.properties
          ./gradlew assembleRelease --console=plain --no-daemon --stacktrace
      - name: Verify and publish
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"
          ! "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump permissions "$APK" | grep -qi 'android.permission.INTERNET'
          TAG=${GITHUB_REF#refs/tags/}
          cp "$APK" "the-bookworm-bliss.apk"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: the-bookworm-bliss.apk
