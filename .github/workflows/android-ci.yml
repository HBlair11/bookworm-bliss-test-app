name: Android CI
on:
  workflow_dispatch:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew
      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0" || test -d "$ANDROID_HOME/build-tools/35.0.1"
      - name: Compile Kotlin
        run: ./gradlew compileDebugKotlin --console=plain --no-daemon --stacktrace
      - name: Check resources
        run: ./gradlew mergeDebugResources --console=plain --no-daemon --stacktrace
      - name: Inject permanent debug keystore
        shell: bash
        env: { KEYSTORE_BASE64: '${{ secrets.EPUB_APP_KEYSTORE_BASE64 }}' }
        run: |
          set -e
          test -n "$KEYSTORE_BASE64"
          mkdir -p ~/.android
          echo "$KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain --no-daemon --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)
          ! "$AAPT2" dump permissions "$APK" | grep -qi 'android.permission.INTERNET'
      - name: Name debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/the-bookworm-bliss.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: the-bookworm-bliss-apk
          path: app/build/outputs/apk/debug/the-bookworm-bliss.apk
          if-no-files-found: error
          retention-days: 10
